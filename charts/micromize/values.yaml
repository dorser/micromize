image:
  repository: ghcr.io/micromize-dev/micromize
  pullPolicy: IfNotPresent
  # The image tag is required.
  tag: ""
  # Image digest for self-exclusion filtering. When set, micromize filters out
  # containers running this digest from monitoring. Resolve with:
  #   crane digest ghcr.io/micromize-dev/micromize:<tag>
  digest: ""

logLevel: info

enforce: true

filterNamespaces: ""

# Label key used to discover exempt namespaces from the Kubernetes API at
# startup. Any namespace with this label set to "true" will be excluded from
# monitoring. Set to empty string to disable this feature.
# NOTE: changes to namespace labels require a DaemonSet restart to take effect.
exemptLabel: "micromize.dev/exempt"

args: []

# Priority class to ensure the pod is scheduled and not preempted
priorityClassName: "system-node-critical"

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

resources:
  limits:
    cpu: 50m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 128Mi

nodeSelector: {}

tolerations:
  - effect: NoSchedule
    operator: Exists
  - effect: NoExecute
    operator: Exists

serviceAccount:
  create: true
  name: "micromize"
  annotations: {}

podAnnotations: {}


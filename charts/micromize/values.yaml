image:
  repository: ghcr.io/micromize-dev/micromize
  pullPolicy: IfNotPresent
  # The image tag is required.
  tag: ""
  # Image digest for self-exclusion filtering. When set, micromize filters out
  # containers running this digest from monitoring. Resolve with:
  #   crane digest ghcr.io/micromize-dev/micromize:<tag>
  digest: ""

logLevel: info

enforce: true

filterNamespaces: ""

args: []

# Priority class to ensure the pod is scheduled and not preempted
priorityClassName: "system-node-critical"

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

resources:
  limits:
    cpu: 50m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 128Mi

nodeSelector: {}

tolerations:
  - effect: NoSchedule
    operator: Exists
  - effect: NoExecute
    operator: Exists

serviceAccount:
  create: true
  name: "micromize"
  annotations: {}

podAnnotations: {}

# Registry authentication for SBOM fetching from private registries.
# Provide the name of an existing Kubernetes secret of type
# kubernetes.io/dockerconfigjson. The secret will be mounted and used
# to authenticate when pulling SBOMs from private registries.
registryAuth:
  existingSecret: ""


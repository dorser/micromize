name: iouring-restrict
description: Detect io_uring usage from containers
homepageURL: https://github.com/micromize-dev/micromize/tree/main/gadgets/iouring-restrict
documentationURL: https://github.com/micromize-dev/micromize/tree/main/gadgets/iouring-restrict
sourceURL: https://github.com/micromize-dev/micromize/tree/main/gadgets/iouring-restrict
datasources:
  iouring_restrict:
    fields:
      event_type:
        annotations:
          description: Numeric event type identifier
      process:
        annotations:
          description: The process invoking an io_uring syscall
      reason:
        annotations:
          description: Human-readable reason for the event
      timestamp_raw:
        annotations:
          description: Timestamp of the event
params:
  ebpf:
    enforce:
      key: enforce
      defaultValue: "true"
      description: Enforce the restriction (block) or just audit
    targ_comm:
      key: targ_comm
      defaultValue: ""
      description: Process name (comm)
    targ_gid:
      key: targ_gid
      defaultValue: ""
      description: Group ID
    targ_pid:
      key: targ_pid
      defaultValue: ""
      description: Process ID
    targ_tid:
      key: targ_tid
      defaultValue: ""
      description: Thread ID
    targ_uid:
      key: targ_uid
      defaultValue: ""
      description: User ID
